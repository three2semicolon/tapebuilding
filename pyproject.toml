[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tapebuilding"
version = "0.1.0"
description = "building and managing my personal music library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beets[embedart,fetchart,lyrics]>=2.12.0",
    "click>=8.1.0",
    "deno>=2.9.1",
    "firebase-admin>=7.5.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "spotdl>=4.5.0",
    "spotipy>=2.26.0",
    "yt-dlp[default]>=2026.8.19",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["lib", "lib.catalog", "download", "organize", "playlists", "tapedeck", "core"]

[project.scripts]
download = "download.cli:download"
cleanup = "organize.cleanup:main"
import = "organize.beets_import:main"
preimport = "organize.preimport:main"
playlists = "playlists.build:main"
tapedeck = "tapedeck.deck:main"
core = "core.build:main"

[project.optional-dependencies]
test = ["pytest"]
    