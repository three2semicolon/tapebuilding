[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tapebuilding"
version = "0.1.0"
description = "building and managing my personal music library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beets[embedart,fetchart,lyrics]>=2.12.0",
    "click>=8.1.0",
    "deno>=2.9.1",
    "firebase-admin>=7.5.0",
    "python-dotenv>=1.2.2",
    "spotdl>=4.5.0",
    "spotipy>=2.26.0",
    "yt-dlp[default]>=2026.8.19",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["lib", "lib.catalog", "download", "organize", "playlists", "tapedeck", "core"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "pytest>=9.1.1",
]
[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.scripts]
download = "download.cli:download"
organize = "organize.cli:organize"
playlists = "playlists.cli:playlists"
tapedeck = "tapedeck.cli:tapedeck"
core = "core.cli:core"
    